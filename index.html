<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>cobawlt.dev</title>
  <link rel="icon" href="/favicon.ico" type="image/x-icon" />
  <style>
    @font-face {
      font-family: 'KHInterference';
      src: url('KH Interference Regular.ttf') format('truetype');
    }

    html, body {
      margin: 0; padding: 0; overflow: hidden;
      background: black;
      height: 100%; width: 100%;
      font-family: 'KHInterference', sans-serif;
      color: white;
    }

    canvas { display: block; }

    .center-text {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      font-size: 45px;
      pointer-events: none;
      white-space: nowrap;
      user-select: none;
      z-index: 1;
    }

    .sub-text {
      position: absolute;
      top: calc(50% + 40px);
      left: 50%;
      transform: translateX(-50%);
      font-size: 15px;
      opacity: 0.67;
      pointer-events: none;
      user-select: none;
      z-index: 1;
    }

    .slip-link {
      position: absolute;
      top: 25px;
      right: 25px;
      font-size: 25px;
      opacity: 0.6;
      text-decoration: none;
      z-index: 5;
      transition: opacity 0.2s;
    }
    .slip-link:hover { opacity: 1; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <div class="center-text" id="centerText">cobawlt.dev</div>
  <div class="sub-text">not much here rn :(</div>
  <a href="/slip" class="slip-link">slip</a>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let width, height;

    const mouse = { x: null, y: null };

    function resize() {
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width;
      canvas.height = height;
    }

    window.addEventListener('resize', resize);
    window.addEventListener('mousemove', e => {
      mouse.x = e.clientX;
      mouse.y = e.clientY;
    });

    resize();

    const dotCount = 150;
    const dots = [];
    const minSpeed = 0.2;
    const maxSpeed = 0.5;
    const maxConnectDist = 172.5;
    const bounceSlowDownRate = 0.02; 
    const lineOpacities = new Map();

    function randomVelocity() {
      const angle = Math.random() * Math.PI * 2;
      const speed = minSpeed + Math.random() * (maxSpeed - minSpeed);
      return {
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        baseSpeed: speed
      };
    }

    for (let i = 0; i < dotCount; i++) {
      const { vx, vy, baseSpeed } = randomVelocity();
      dots.push({
        x: Math.random() * width,
        y: Math.random() * height,
        vx, vy,
        baseSpeed,
        baseSize: 3 + Math.random() * 2,
        alpha: 1,
        fadingOut: false,
        fadingIn: false,
        bounceTimes: [],
        lastBounceTime: 0
      });
    }

    function getTextRect() {
      const rect = document.getElementById('centerText').getBoundingClientRect();
      return { x: rect.left, y: rect.top, width: rect.width, height: rect.height };
    }

    function now() { return performance.now(); }

    function recordBounce(dot) {
      const t = now();
      if (dot.lastBounceTime && t - dot.lastBounceTime < 200) return;
      dot.lastBounceTime = t;
      dot.bounceTimes.push(t);
      dot.bounceTimes = dot.bounceTimes.filter(time => t - time <= 1000);
    }

    function bounceFromCursor(dot) {
      if (mouse.x === null) return false;

      const dx = dot.x - mouse.x;
      const dy = dot.y - mouse.y;
      const dist = Math.sqrt(dx*dx + dy*dy);

      if (dist < 30 && dist > 0) {
        const force = (30 - dist) / 30;
        dot.vx += (dx/dist) * force * 0.15;
        dot.vy += (dy/dist) * force * 0.15;
        recordBounce(dot);
        return true;
      }
      return false;
    }

    function bounceFromRect(dot, rect) {
      if (
        dot.x > rect.x - 5 && dot.x < rect.x + rect.width + 5 &&
        dot.y > rect.y - 5 && dot.y < rect.y + rect.height + 5
      ) {
        if (!dot.fadingOut) {
          dot.fadingOut = true;
          dot.fadingIn = false;
        }
        return true;
      }
      return false;
    }

    function enforceMinSpeed(dot) {
      const speed = Math.sqrt(dot.vx**2 + dot.vy**2);
      if (speed === 0) return;
      const diff = speed - dot.baseSpeed;
      dot.vx -= (diff / speed) * dot.vx * bounceSlowDownRate;
      dot.vy -= (diff / speed) * dot.vy * bounceSlowDownRate;
    }

    function fadeOutAndRespawn(dot) {
      if (dot.fadingOut) {
        dot.alpha -= 0.02;

        if (dot.alpha <= 0) {
          // respawn invisible
          dot.x = Math.random() * width;
          dot.y = Math.random() * height;
          const { vx, vy, baseSpeed } = randomVelocity();
          dot.vx = vx;
          dot.vy = vy;
          dot.baseSpeed = baseSpeed;

          dot.alpha = 0;
          dot.fadingOut = false;
          dot.fadingIn = true;
        }
      }

      if (dot.fadingIn) {
        dot.alpha += 0.02;
        if (dot.alpha >= 1) {
          dot.alpha = 1;
          dot.fadingIn = false;
        }
      }
    }

    function draw() {
      ctx.clearRect(0, 0, width, height);
      const textRect = getTextRect();

      for (let dot of dots) {

        if (!dot.fadingOut) {
          dot.x += dot.vx;
          dot.y += dot.vy;

          if (dot.x < 0 || dot.x > width) dot.vx *= -1;
          if (dot.y < 0 || dot.y > height) dot.vy *= -1;

          bounceFromCursor(dot);
          bounceFromRect(dot, textRect);
          enforceMinSpeed(dot);
        }

        fadeOutAndRespawn(dot);

        // INVERTED SIZE LOGIC
        let size = 1;

        if (mouse.x !== null) {
          const dx = dot.x - mouse.x;
          const dy = dot.y - mouse.y;
          const dist = Math.sqrt(dx*dx + dy*dy);
          const maxDist = 200;

          if (dist < maxDist) {
            const factor = 1 - (dist / maxDist);
            size = 1 + factor * dot.baseSize * 1.5;
          }
        }

        ctx.beginPath();
        ctx.arc(dot.x, dot.y, size, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255,255,255,${dot.alpha})`;
        ctx.fill();
      }

      requestAnimationFrame(draw);
    }

    draw();
  </script>
</body>
</html>
